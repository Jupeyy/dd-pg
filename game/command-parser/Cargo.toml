[package]
name = "command-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
hiarc = { path = "../../lib/hiarc", features = ["derive"] }

serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
anyhow = { version = "1.0.89", features = ["backtrace"] }
logos = { version = "0.14.2" }
snailquote = "0.3.1"
regex = "1.11.0"
thiserror = "1.0.64"
