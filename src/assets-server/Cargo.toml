[package]
name = "assets-server"
version = "0.1.0"
edition = "2021"

[dependencies]
base = { path = "../../lib/base" }

client-extra = { path = "../../game/client-extra" }
assets-base = { path = "../../game/assets-base" }

tokio = { version = "1.40.0", features = ["rt-multi-thread", "sync", "fs", "net", "time", "macros"] }
anyhow = { version = "1.0.89", features = ["backtrace"] }
axum = "0.7.7"
tower-http = { version = "0.6.1", features = ["fs", "trace"] }
log = "0.4.22"
serde_json = "1.0.128"
clap = { version = "4.5.20", features = ["derive"] }
tar = "0.4.42"
path-slash = "0.2.1"
