[package]
name = "config"
version = "0.1.0"
edition = "2021"

[dependencies]
math = { path = "../math" }
config-macro = { path = "../config-macro" }
hiarc = { path = "../hiarc", features = ["derive"] }

serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
num-derive = "0.4.2"
num-traits = "0.2.19"
anyhow = { version = "1.0.89", features = ["backtrace"] }
atomic_enum = "0.3.0"
thiserror = "1.0.64"

[package.metadata.cargo-machete]
ignored = ["num-traits"]
